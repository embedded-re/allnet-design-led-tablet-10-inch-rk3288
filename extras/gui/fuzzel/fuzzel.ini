# /etc/xdg/fuzzel/fuzzel.ini — big rows for touch
[main]
font=DejaVu Sans:size=16
terminal=foot -e
lines=8
width=36
horizontal-pad=24
vertical-pad=16
inner-pad=12
line-height=40
icons-enabled=yes
icon-theme=Adwaita
[colors]
background=15202bf0
text=e6e6e6ff
match=6cb6ffff
selection=3b6e9cff
selection-text=ffffffff
border=3b6e9cff
[border]
width=2
radius=8
