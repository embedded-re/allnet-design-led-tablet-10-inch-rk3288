# /etc/xdg/weston/weston.ini — smarttab (started by hand via `gui start`, never at boot)
[core]
idle-time=300
require-input=false

[output]
name=DSI-1
mode=preferred
# transform is set per run by `gui start --rotate N` (writes a copy of this file)
transform=normal

[shell]
panel-position=top
background-color=0xff203040
clock-format=minutes
locking=false

[keyboard]
keymap_layout=us

[libinput]
enable-tap=true

[terminal]
font=DejaVu Sans Mono
font-size=16

# panel launcher: foot (truecolor, font fallback for braille/symbols) instead of weston-terminal
[launcher]
icon=/usr/share/weston/icon_terminal.png
path=/usr/bin/foot
