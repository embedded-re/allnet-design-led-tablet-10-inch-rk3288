# /etc/asound.conf — smarttab: dmix so several apps can play at once (no sound server)
pcm.!default {
	type plug
	slave.pcm "dmixer"
}
pcm.dmixer {
	type dmix
	ipc_key 1024
	ipc_perm 0666
	slave {
		pcm "hw:0,0"
		rate 48000
		period_time 0
		period_size 1024
		buffer_size 4096
	}
}
ctl.!default {
	type hw
	card 0
}
