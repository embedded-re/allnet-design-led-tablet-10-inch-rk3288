# /etc/wireplumber/wireplumber.conf.d/50-smarttab-alsa.conf
# The speaker amp is very loud. ACP/UCM would take over the ES8316 hardware mixer
# (incl. the Headphone stage) and set its own levels -> disabled. PipeWire then opens
# hw:0 as a plain PCM and NEVER touches the mixer; loudness stays with `vol` (DAC only).
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.*" } ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
        api.alsa.use-ucm = false
        api.alsa.soft-mixer = true
      }
    }
  }
]
