# /etc/pipewire/pipewire.conf.d/50-smarttab-sink.conf
# Static ALSA sink for the ES8316. WirePlumber's udev monitor can't see the card here
# (libudev-zero sets no SOUND_INITIALIZED), and a plain api.alsa.pcm.sink never touches
# the hardware mixer — loudness stays with `vol` (DAC only, 6 dB steps, -6 dB cap).
context.objects = [
  { factory = adapter
    flags = [ nofail ]   # card busy (e.g. a dmix client) must not kill pipewire
    args = {
      factory.name     = api.alsa.pcm.sink
      node.name        = "es8316-out"
      node.description = "Tablet speaker / jack (ES8316)"
      media.class      = "Audio/Sink"
      api.alsa.path    = "hw:0,0"
      audio.format     = "S16LE"
      audio.rate       = 48000
      audio.channels   = 2
      audio.position   = [ FL FR ]
      priority.driver  = 2000
      priority.session = 2000
    }
  }
]
